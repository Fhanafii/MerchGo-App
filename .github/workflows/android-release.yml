name: Android Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      ##########################################################
      ## Checkout
      ##########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ##########################################################
      ## Validate Gradle Wrapper
      ##########################################################

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      ##########################################################
      ## Setup Java
      ##########################################################

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      ##########################################################
      ## Setup Android SDK
      ##########################################################

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      ##########################################################
      ## Setup Gradle Cache
      ##########################################################

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      ##########################################################
      ## Gradle Permission
      ##########################################################

      - name: Grant execute permission
        run: chmod +x gradlew

      ##########################################################
      ## Build Release APK
      ##########################################################

      - name: Build Release APK
        run: |
          ./gradlew \
            clean \
            assembleRelease \
            --stacktrace \
            --no-daemon

      ##########################################################
      ## Generate Next Version Tag
      ##########################################################

      - name: Generate Tag
        id: tag
        run: |
          git fetch --tags

          latest=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            latest="v1.0.0"
          fi

          echo "Latest Tag : $latest"

          version=${latest#v}

          IFS='.' read major minor patch <<< "$version"

          patch=$((patch+1))

          new="v$major.$minor.$patch"

          echo "new_tag=$new" >> "$GITHUB_OUTPUT"

      ##########################################################
      ## Create Git Tag
      ##########################################################

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git rev-parse "${{ steps.tag.outputs.new_tag }}" >/dev/null 2>&1; then
            echo "Tag already exists."
          else
            git tag "${{ steps.tag.outputs.new_tag }}"
            git push origin "${{ steps.tag.outputs.new_tag }}"
          fi

      ##########################################################
      ## Rename APK
      ##########################################################

      - name: Rename APK
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          cp "$APK" "release/MerchGo-${{ steps.tag.outputs.new_tag }}.apk"

      ##########################################################
      ## Upload Artifact
      ##########################################################

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerchGo-${{ steps.tag.outputs.new_tag }}
          path: release/*.apk

      ##########################################################
      ## GitHub Release
      ##########################################################

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: release/*.apk